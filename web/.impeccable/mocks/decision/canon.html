<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{--bg:#f3f4fb;--card:#fff;--ink:#1f2333;--ink2:#61667a;--acc:#5b5bd6}
  *{box-sizing:border-box;margin:0}
  body{width:390px;height:844px;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.45;padding:18px 18px}
  .bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:20px}
  .av{width:36px;height:36px;border-radius:50%;background:#dcdcf7}
  h1{font-size:28px;margin-top:20px}
  .sub{color:var(--ink2)}
  .status{margin-top:18px;background:var(--card);border-radius:20px;padding:18px;box-shadow:0 4px 20px -10px #1f233340}
  .status b{color:var(--acc)}
  .pill{display:inline-block;margin-top:10px;background:#ececfc;color:var(--acc);font-weight:600;font-size:14px;padding:5px 12px;border-radius:99px}
  h2{font-size:19px;margin:24px 0 10px}
  .row{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
  .ic{width:42px;height:42px;border-radius:12px;background:#ececfc;flex:none}
  .row small{display:block;color:var(--ink2);font-size:14px}
</style></head><body>
<div class="bar"><span>Remi</span><span class="av"></span></div>
<h1>Good evening, Linda</h1>
<p class="sub">Here's how Dad is doing.</p>
<div class="status"><b>A gentle note</b><p>A few things about how Hal talks have shifted lately.</p><span class="pill">Learn more</span></div>
<h2>Recent chats</h2>
<div class="row"><span class="ic"></span><p>Told Sam about his first car<small>Today · 1 min</small></p></div>
<div class="row"><span class="ic"></span><p>The 1977 blizzard, again<small>Fri, Oct 16 · 7 min</small></p></div>
<div class="row"><span class="ic"></span><p>Garden's done for the year<small>Wed, Oct 14 · 9 min</small></p></div>
</body></html>
