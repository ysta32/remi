<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{--page:#e4ecdf;--card:#fbfaf4;--ink:#2d3a2e;--ink2:#5a6a5b;--honey:#e9b872;--clay:#c96f53}
  *{box-sizing:border-box;margin:0}
  body{width:390px;height:844px;overflow:hidden;font-family:Figtree,sans-serif;color:var(--ink);background:var(--page);font-size:17px;line-height:1.45;padding:18px 20px}
  .bar{display:flex;justify-content:space-between;align-items:center}
  .word{font-weight:800;font-size:22px}
  .menu{font-size:14px;font-weight:600;background:#ffffff99;padding:6px 12px;border-radius:99px}
  h1{font-size:32px;font-weight:800;margin-top:18px}
  .sub{color:var(--ink2)}
  .week{display:inline-block;margin:20px 0 10px;font-family:'Patrick Hand',cursive;font-size:22px;background:var(--card);padding:4px 14px;border-radius:4px;transform:rotate(-2deg);box-shadow:0 2px 0 #0000001a}
  .mount{background:var(--card);padding:14px;position:relative;margin-bottom:16px;box-shadow:0 6px 18px -12px #2d3a2e80}
  .mount:before,.mount:after{content:"";position:absolute;width:22px;height:22px;background:#2d3a2e;clip-path:polygon(0 0,100% 0,0 100%)}
  .mount:before{left:-4px;top:-4px}
  .mount:after{right:-4px;bottom:-4px;transform:rotate(180deg)}
  .ph{height:150px;background:linear-gradient(150deg,#e9b872,#c9d7c1);margin-bottom:10px}
  .cap{font-family:'Patrick Hand',cursive;font-size:22px}
  .txt{color:var(--ink2);font-size:16px;margin-top:4px}
  .note{background:#fff3dc;border:1px solid var(--honey);padding:12px 14px;border-radius:10px;margin-top:4px}
  .note b{display:block}
</style></head><body>
<div class="bar"><span class="word">Remi</span><span class="menu">Menu</span></div>
<h1>Hal's album</h1>
<p class="sub">Last chat 2 minutes ago</p>
<p class="week">week of Oct 19</p>
<div class="mount">
  <div class="ph"></div>
  <p class="cap">told Sam about his first car</p>
  <p class="txt">A '57 Chevy Bel Air he bought for $300, stuck in the mud on the way to Raystown Lake.</p>
</div>
<div class="note"><b>A gentle note from Remi</b>A few things about how Hal talks have shifted lately.</div>
</body></html>
